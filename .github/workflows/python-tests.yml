name: Python Unit Tests

# on:
#   push:
#     branches: [ "main", "master" ]
#   pull_request:
#     branches: [ "main", "master" ]

on:
  push:
    branches: [ "refactor_py_code" ]
  
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        
        if [ -f FrontlineServer/requirements.txt ]; then pip install -r FrontlineServer/requirements.txt; fi
        
        if [ -f FrontlineServer/tests/requirements-dev.txt ]; then pip install -r FrontlineServer/tests/requirements-dev.txt; fi

    - name: run
      run: |
        pytest FrontlineServer/tests/